Version: 1.2

# Canary patches bundled with ARMSX3.
#
# RPCS3's official feed (rpcs3.net/compatibility?patch&api=v1&v=1.2) does not carry
# these. They live on the RPCS3 wiki as "canary" patches that a desktop user adds by
# hand through the Patch Manager's import button -- a step there is no equivalent of
# on Android, so without bundling them the affected games are simply broken for us.
#
# Only patches that fix a game which is otherwise unplayable belong here. This is not
# a place for 60fps unlocks or resolution mods: those are the online database's job,
# and shipping them would fork a database we would then have to maintain.
#
# Ps3PatchRepo.BUNDLED must list every patch here, or it is imported but never enabled.

# SONIC THE HEDGEHOG (2006) -- upstream RPCS3 issue #4122, open since 2018.
#
# A PPU/SPU race: an SNR (signal notification register) is overwritten while still
# non-empty, so the SPU jobs that feed geometry lose their signal and whole draw
# batches never render. The game shows the HUD and the skybox and flickers everything
# else in and out of existence. Desktop RPCS3 behaves identically without this patch.
#
# Hooks RPCS3_HLE_LIBRARY:WaitForSPUsToEmptySNRs, which is in the core at
# rpcs3/Emu/Cell/Modules/HLE_PATCHES.cpp and exists solely to serve this patch.
#
# ARM64 needs three upstream fixes for this to work rather than crash, all present in
# this tree: PR #16022 (calloc code-cave blocks registered in ppu_patch_block_registry_t),
# the is_faux_function guard in AArch64JIT.cpp that stops the tail-call return trap from
# firing on a patch-point, and PR #17526 (PPU LLVM filters functions carrying patches).
#
# Keyed by PPU hash, so it applies only to the dump it was built for -- other regions
# and revisions (BLES00028, v01.00) need their own entry with their own hash.
PPU-4b46d0161ca657ab16b0a779d9062810ea5ea2dd:
  Graphics Fix:
    Games:
      "SONIC THE HEDGEHOG":
        BLUS30008:
          # Quoted deliberately. The official database writes these bare (- 01.00) and
          # yaml-cpp is fine with that because it hands back the raw scalar text, but a
          # bare 01.01 is a float to most YAML readers and round-trips as "1.01". This
          # key is compared against PARAM.SFO's VERSION at apply time, so if it ever
          # became 1.01 the patch would silently stop matching the disc.
          - "01.01"
    Author: elad335
    Patch Version: 1.0
    Notes: Fixes missing graphics ingame.
    Patch:
      - [ calloc, 0x00f07714, 0x04 ]
      - [ be32, 0x00000000, 0x38800003 ] # li r4, 3
      - [ jumpf, 0x00000000, "RPCS3_HLE_LIBRARY:WaitForSPUsToEmptySNRs" ] # Args: (SPU ID, 3)
      - [ be32, 0x00000000, 0x38800000 ] # li r4, 0
      - [ be32, 0x00000000, 0x44000002 ] # sc

# Tom Clancy's H.A.W.X. 2 (BLES00928) -- boot hang at the first intro video.
#
# The SPU dies with "Access violation reading location 0x20" in CellSpursKernel0 and
# is parked forever (dbg_pause, which nothing in the Android build can clear), so the
# emulator looks healthy at a locked 30 fps while the guest is dead. Upstream RPCS3
# lists the title as Loadable with no fix but "delete data/movies".
#
# The title looks up a section named '.reload' in this SPU module. The module is
# stripped -- e_shnum = 0 -- so the lookup can never succeed, on hardware either, and
# the game is built to cope: the failure path writes 0 to the work descriptor's +0x10
# field, and this very module tests that field to skip the overlay load:
#
#   03224  lqr r8,0x1b810     ; r8 = desc[+0x10]
#   0322c  brz r8,0x32cc      ; == 0 -> skip
#
# A bump allocator on the PPU side then runs over the field unconditionally --
# (0 - 0x10) & ~0xF = 0xfffffff0 -- destroying the sentinel. The guard no longer
# fires, so the SPU issues GET lsa=0 ea=0 size=0x4000, a transfer that would have
# overwritten the running SPURS kernel had it succeeded.
#
# This makes the overlay routine at LS 0x3208 return immediately, which is what the
# surviving guard would have caused anyway. Safe because the section it needs cannot
# exist in a stripped module. Suppressing the DMA instead does NOT work: the guest
# loop waits on data that never arrives and runs away.
#
# Ps3PatchRepo.BUNDLED must list this, or it is imported but never enabled.

SPU-42bae8e5d6a9304068ba1c6bbfdc18d656e287a1:
  Bink overlay skip:
    Games:
      "Tom Clancy's H.A.W.X. 2":
        BLES00928:
          - "All"
    Author: Zulux91
    Patch Version: 1.0
    Notes: Fixes the boot hang at the first intro video.
    Patch:
      # LS 0x3208 is the first instruction of the overlay routine (il r5,0).
      # Offsets are LS addresses: apply_modification subtracts p_vaddr (0x3000).
      - [ be32, 0x3208, 0x35000000 ] # bi lr -- return immediately

# RATCHET & CLANK FUTURE: A CRACK IN TIME -- hangs starting a New Game.
#
# The engine waits for the RSX to drain its command ring, but reads GET once before
# the loop rather than inside it:
#
#       lwz  r29,4(r12)        ; GET, read ONCE
#   0x5cb1bc:
#       lwz  r9,0(r11)         ; PUT
#       cmpw cr6,r9,r29
#       bne  cr6,0x5cb1bc      ; branches back AFTER the read
#
# That only terminates if GET has already reached PUT at the instant it is sampled.
# On hardware the RSX has essentially always caught up by then, so the loop exits
# immediately. Catch it one command short and it compares PUT against a value GET has
# since moved past, and it spins forever.
#
# Captured with the stall watchdog: PUT = GET = 0x161af6c with the snapshot holding
# 0x161af64, unchanged across eight samples 40 seconds apart, every other guest thread
# blocked and the ring drained. The game does its own FIFO management -- it imports no
# cellGcmFlush or cellGcmFinish -- so there is no HLE call to fix this behind.
#
# Moving the branch target back one instruction re-reads GET each pass, which is what
# the loop means. It exits as soon as GET reaches PUT, and is a no-op in every case
# where the original would already have exited, so it cannot change a working boot.
#
# Ps3PatchRepo.BUNDLED must list this, or it is imported but never enabled.

# RATCHET & CLANK, the whole family. Every one of these games freezes without its fix, and
# the fixes are Juhn's, from the community patch database -- reproduced here so a fresh
# install is not one download away from a game that hangs. Ps3PatchRepo.BUNDLED must list
# every (hash, name, serial) below or the patch is imported and never enabled.
#
# A Crack in Time (BCUS98124) REPLACES an ARMSX3 patch of our own, "FIFO drain wait fix",
# which wrote the same word at 0x005cb1c4 with 0x409AFFF4 against Juhn's 0x409EFFF4. Both
# retarget the branch to -12; ours also moved the condition from cr7 to cr6, which is one
# bit of a guess against a fix the whole RPCS3 community runs. They cannot coexist -- in a
# tester's log both applied to the same instruction and the last one won -- so ours is
# retired rather than left to race.

