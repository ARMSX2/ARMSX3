      - [ be32, 0x157a0, 0x413fbfcb ] # ilhu r75,0x7f7f (was 0x413fffcb): FLT_MAX instead of SPU max
      - [ be32, 0x158d8, 0x413fbfa0 ] # ilhu r32,0x7f7f (was 0x413fffa0): FLT_MAX instead of SPU max
      - [ be32, 0x17098, 0x413fbfbd ] # ilhu r61,0x7f7f (was 0x413fffbd): FLT_MAX instead of SPU max
