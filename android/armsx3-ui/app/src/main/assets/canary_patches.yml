# THE IDOLM@STER 2, NPJB00337 v01.00 -- ours. Crash as the boot screen gives way to the logo,
# "Access violation reading location 0x0" on NU::Draw::RequestManager (0x44ba8c). About one boot
# in four at default settings and every boot with PPU Threads 1; the PPU interpreter only hid it
# by being slower, it crashes there too with PPU Threads 1.
#
# Each frame the main thread's frame sync (0x42bd48) swaps the draw lists and wakes the draw
# thread (KickDraw, 0x435384) to turn last frame's list into RSX commands, then goes straight on
# to the frame's update. A draw request (vtable 0x648428) holds plain pointers to the objects it
# draws and takes no reference, and the update is where a scene change releases its objects
# (count at +4, Release 0x42d864). On a PS3 the draw thread starts on the other hardware thread at
# once and is long done with the list before the update gets that far. Here the update can win: a
# write watch on the object saw the main thread drop its count to 0 and free it 1.4 ms before the
# draw thread called through it.
#
# KickDraw now waits for the draw thread to finish that list before it returns, with the game's
# own WaitDrawIdle (0x435354, which the blocking frame sync at 0x42bee8 already calls before its
# flip). The twelve words fit KickDraw exactly: set the draw event to 1 as before, then tail-call
# WaitDrawIdle. Only the two frame syncs call KickDraw, on the main thread with no lock held, and
# the draw thread clears the event as soon as the list is done, before it waits for the flip, so
# the wait cannot deadlock. It costs the main thread one list's worth of draw thread time per
# frame (about 0.2 ms on the logo screen).
#
# Tested on an Odin 3: with PPU Threads 1 the crash came on 8 of 8 boots before and 0 of 6 after;
# 3 of 3 boots at default settings reached the title screen. The tester's crash log is the same
# executable. Ps3PatchRepo.BUNDLED must list this, or it is imported but never enabled.
PPU-f942422316f63af3d64dc940b35ec8fddade0f44:
  "ARMSX3 boot crash fix":
    Games:
      "THE IDOLM@STER 2":
        NPJB00337: [ 01.00 ]
    Author: "jpolo1224"
    Notes: "Fixes the crash when the boot screen changes to the logo."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x00435384, 0x7c0802a6 ] # mflr r0
      - [ be32, 0x00435388, 0xf8010010 ] # std r0,0x10(r1)
      - [ be32, 0x0043538c, 0xf821ff81 ] # stdu r1,-0x80(r1)
      - [ be32, 0x00435390, 0xf8610070 ] # std r3,0x70(r1): the request manager
      - [ be32, 0x00435394, 0x38630068 ] # addi r3,r3,0x68: its draw event
      - [ be32, 0x00435398, 0x38800001 ] # li r4,1
      - [ be32, 0x0043539c, 0x4bffa939 ] # bl 0x42fcd4: set the event to 1, wakes the draw thread (as before)
      - [ be32, 0x004353a0, 0xe8610070 ] # ld r3,0x70(r1)
      - [ be32, 0x004353a4, 0x38210080 ] # addi r1,r1,0x80
      - [ be32, 0x004353a8, 0xe8010010 ] # ld r0,0x10(r1)
      - [ be32, 0x004353ac, 0x7c0803a6 ] # mtlr r0
      - [ be32, 0x004353b0, 0x4bffffa4 ] # b 0x435354: WaitDrawIdle, returns once the list is drawn

# BLITZ: THE LEAGUE II, BLUS30203 v01.00 -- ours. The game runs its own job system on three raw
# SPUs. Each one's main loop counts its passes and parks itself (stop 0x1300) when the count
# reaches a limit, after which the PPU is expected to restart it. On a PS3 every pass waits on a
# DMA, so the 2,097,152 passes take long enough that the SPUs never park in the middle of a load;
# here a DMA completes at once, the limit runs out during the data install or a match load,
# nothing restarts the parked SPU, and the game waits for its work forever: the install stalls
# (behind a black screen on the first boot) and matches freeze on one frame.
#
# The patch turns the program's own "no limit" test (brz r3, taken when the limit is 0) into an
# unconditional branch back to the loop, so the SPUs never park. The limit itself cannot be
# patched: the PPU writes each program's parameter block, limit included, into LS at run time
# (raw SPU 1's carries a heap pointer, 0x0149cc00), and a patched data word was overwritten.
# The stop handler's sys_mutex_lock ESRCH in the log is the game's own and harmless: its mutex
# id global (0x1318b10) holds 0 and the handler ignores the error. Found with a probe build on
# the Odin 3, 10-19: limit 0x00200000 at LS 0xcd2c, counter at the same value.
#
# The two programs are embedded in the executable and copied into LS by the game itself.
# Offsets are LS addresses: apply_modification maps them into the image's code segment.
# Ps3PatchRepo.BUNDLED must list these, or they are imported but never enabled.
SPU-30d17ae952dd9ccc1abc46b631654e1fe432fde9:
  "ARMSX3 raw SPU park fix":
    Games:
      "Blitz: The League II":
        BLUS30203: [ All ]
        BLES00397: [ All ]
    Author: "jpolo1224"
    Notes: "Keeps the game's SPU workers from parking during loads, which froze the data install and matches."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x0ab8c, 0x327f8a00 ] # br 0x0a7dc (was brz r3,0x0a7dc, 0x207f8a03): never count toward the park limit
SPU-93f3b15e03c594d9eaf5a0d8521854fd6eb2a8c7:
  "ARMSX3 raw SPU park fix":
    Games:
      "Blitz: The League II":
        BLUS30203: [ All ]
        BLES00397: [ All ]
    Author: "jpolo1224"
    Notes: "Keeps the game's SPU workers from parking during loads, which froze the data install and matches."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x075ac, 0x327fd700 ] # br 0x07464 (was brz r3,0x07464, 0x207fd703): never count toward the park limit

# BATMAN: ARKHAM ORIGINS, US releases (BLUS31147, BLUS31207, NPUB31261) update 01.06, multiplayer executable
# (MP.SELF) -- ours, OFF by default. The US releases run the same MP.SELF.
#
# Online play on Arkham: Revived meets only RPCN players, and a private lobby's host gets no START GAME
# button until 3 players are in. The lobby script (BmScript GDGFxMovieUI_LobbyMenu, cooked into the
# disc's MULTIPLAYER/BMGAME/COOKEDPS3/FRONTEND.XXX) decides it with
#     IsReadyToStartPrivateGame(NumPlayers) = NumPlayers >= (class'GDWorldInfo'.static.IsShippingBuild() ? 3 : 1)
# and PopulateLobbyListTeam only asks after bIsLobbyHost, so only the host needs this patch: players
# with and without it can share a lobby. Public lobbies (start once full) are left alone.
#
# IsShippingBuild() cannot simply return false: RGameInfo.AllowCheats is "return !IsShippingBuild()",
# so that would allow cheats online. Nor can 0xcfe50, the li r3,1 it calls: that function is shared by
# 29 callers. The cave replaces that call inside AWorldInfo::execIsShippingBuild (0xf76ec4) and answers
# "not shipping" only when the script bytes right after the call are the private check's own
# "? 3 : 1": 00 02 7c 03 00 01 0f 5e (skip 2, byte 3, skip 1, one, end of parms; Arkham Origins
# shuffles the bytecode token values). There r4 is the script frame and r5 its code pointer, already
# past the call (P_FINISH). Every other caller still gets "shipping", and the private minimum becomes
# 1, the developers' own rule.
#
# Deliberately NOT in Ps3PatchRepo.BUNDLED: it changes a game rule rather than fixing a broken game,
# so it stays off until the host turns it on.
PPU-602e58994456e14dfd80a6e0f376729b53c3109a:
  "Private matches start with fewer players":
    Games:
      "Batman: Arkham Origins":
        BLUS31147: [ All ]
        BLUS31207: [ All ]
        NPUB31261: [ All ]
    Author: "jpolo1224"
    Notes: "Lets the host start a private match with fewer than 3 players. Only the host needs it on."
    Patch Version: 1.0
    Patch:
      - [ calloc, 0x00f76ec4, 0x0c ] # in place of bl 0xcfe50 (li r3,1); returns to stw r3,0(r31)
      - [ be32, 0x00000000, 0x80c50000 ] # lwz r6,0(r5): the script bytes after the call
      - [ be32, 0x00000000, 0x3ce00002 ] # lis r7,0x0002
      - [ be32, 0x00000000, 0x60e77c03 ] # ori r7,r7,0x7c03
      - [ be32, 0x00000000, 0x38600001 ] # li r3,1: shipping, as before
      - [ be32, 0x00000000, 0x7c063800 ] # cmpw r6,r7
      - [ be32, 0x00000000, 0x4082001c ] # bne +0x1c: some other caller
      - [ be32, 0x00000000, 0x80c50004 ] # lwz r6,4(r5)
      - [ be32, 0x00000000, 0x3ce00001 ] # lis r7,0x0001
      - [ be32, 0x00000000, 0x60e70f5e ] # ori r7,r7,0x0f5e
      - [ be32, 0x00000000, 0x7c063800 ] # cmpw r6,r7
      - [ be32, 0x00000000, 0x40820008 ] # bne +8
      - [ be32, 0x00000000, 0x38600000 ] # li r3,0: the private check, so its minimum is 1

# TALES OF GRACES F, BLUS30903 -- ours. Keeps the field at 30 fps under a 60 fps limit, so battles run at 60.
#
# The game paces itself with label 0xc0, which the GPU waits on before every flip. Its flip handler
# (0x477370) sets a countdown of interval - 1 vblanks (interval 2 on the field, 1 in battle) and clears
# the label when that is not 0; its vblank handler (0x477314) counts down and sets the label again at 0.
# On a PS3 a flip always lands on a vblank, so the field gets exactly 2 vblanks a frame.
#
# PS3 Native keeps that, but battle runs 30 to 50 fps there: a frame that misses its vblank by a little
# waits a whole extra one. A 60 fps limit holds battle at 60, but flips then land between vblanks, and
# the countdown, started at the flip, frees the field again at the very next vblank: 60 fps, double speed.
#
# The cave counts from the vblank the frame was released on instead: countdown = release + interval - now,
# kept within 0..interval, and the next release (now + countdown) is stored in the label's spare word,
# label + 4 (libgcm spaces labels 16 bytes apart and the GPU uses only the first word). Battle (interval
# 1) keeps the game's own path. Under PS3 Native a flip lands one vblank after its release, so the
# countdown comes out at interval - 1 as before. ConfigDatabase.LOCAL_OVERRIDES gives this title the
# 60 fps limit to go with it.
PPU-3e9032a3f7857057ef783810bd8f34a439baaa59:
  "Field at 30 fps with a 60 fps limit":
    Games:
      "Tales of Graces f":
        BLUS30903: [ All ]
    Author: "jpolo1224"
    Notes: "Keeps the field at 30 fps and normal speed with the frame limit at 60, so battles run at 60."
    Patch Version: 1.0
    Patch:
      - [ calloc, 0x0047739c, 0x11 ] # in place of lwz r0,0x1e0(r31) after cellGcmGetLabelAddress(0xc0); returns to cmpwi cr7,r0,0
      - [ be32, 0x00000000, 0x813f01e4 ] # lwz r9,0x1e4(r31): interval
      - [ be32, 0x00000000, 0x2f890001 ] # cmpwi cr7,r9,1
      - [ be32, 0x00000000, 0x409d0038 ] # ble cr7,+0x38: battle keeps the game's countdown
      - [ be32, 0x00000000, 0x817f01dc ] # lwz r11,0x1dc(r31): vblank count, low word
      - [ be32, 0x00000000, 0x81430004 ] # lwz r10,4(r3): the vblank this frame was released on
      - [ be32, 0x00000000, 0x7d4a4a14 ] # add r10,r10,r9: when the next frame is due
      - [ be32, 0x00000000, 0x7c0b5050 ] # subf r0,r11,r10: vblanks from now
      - [ be32, 0x00000000, 0x2f800000 ] # cmpwi cr7,r0,0
      - [ be32, 0x00000000, 0x409c0008 ] # bge cr7,+8
      - [ be32, 0x00000000, 0x38000000 ] # li r0,0: a late frame, release at once
      - [ be32, 0x00000000, 0x7f804800 ] # cmpw cr7,r0,r9
      - [ be32, 0x00000000, 0x409d0008 ] # ble cr7,+8
      - [ be32, 0x00000000, 0x7d204b78 ] # mr r0,r9: never more than interval
      - [ be32, 0x00000000, 0x901f01e0 ] # stw r0,0x1e0(r31): countdown
      - [ be32, 0x00000000, 0x7d4b0214 ] # add r10,r11,r0
      - [ be32, 0x00000000, 0x91430004 ] # stw r10,4(r3): the next frame's release
      - [ be32, 0x00000000, 0x801f01e0 ] # lwz r0,0x1e0(r31): the replaced instruction

PPU-db1e09abb1a2785532b89e9a366d2510ba8e070c:
  "Battle freeze fix":
    Games:
      "J-Stars Victory VS+":
        BLUS31519: [ 01.00 ]
    Author: "jpolo1224"
    Notes: "Stops battles freezing with the music still playing, most often during ultimate attacks. An effect job that reaches a record the game has already reused now ends its list there instead of halting the SPU."
    Patch Version: 1.0
    Patch:
      # SPU code of the SPURS effect job, embedded in the EBOOT (LS address = address - 0x853380).
      # Its first pass prefetches each record's successor and halts (heqi) on a misaligned link,
      # which a recycled record carries. Rewritten so that link makes this record the last one.
      - [ be32, 0x00858988, 0x3fbf2eb5 ] # rotqmbyi r53,r93,-4
