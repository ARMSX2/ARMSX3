# SPDX-License-Identifier: GPL-2.0-only
# XcodeGen spec for the ARMSX3 app and its JIT enabler extension; ios/ARMSX3.xcodeproj is generated from it.
name: ARMSX3

# The JITEnabler extension is embedded only when ARMSX3_JIT_ENABLER_EMBED is YES, true or 1.
include:
  - path: jit-enabler/embed.yml
    enable: ${ARMSX3_JIT_ENABLER_EMBED}

options:
  bundleIdPrefix: com.armsx3
  deploymentTarget:
    # 17.4 is where os_sync_wait_on_address stops weak-linking; keep it equal to IOS_DEPLOYMENT_TARGET in configure.sh.
    iOS: "17.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # English is the only shipped locale; the catalog is ios/app/Resources/Localizable.xcstrings.
  developmentLanguage: en

settings:
  base:
    # The device floor is A14, so arm64 only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

    # A split Debug build puts dylibs at the bundle root that a manual signing step misses, so keep one binary.
    ENABLE_DEBUG_DYLIB: NO

targets:
  ARMSX3:
    type: application
    platform: iOS

    # Directory entries, so a new source file is picked up by re-running the generator.
    sources:
      # The SwiftUI app; its Info.plist and entitlements are not bundle resources.
      - path: app
        excludes:
          - "Resources/Info.plist"
          - "*.entitlements"
      # Only the launcher's two files compile into the app; the rest of jit-enabler/ belongs to the JITEnabler target.
      - path: jit-enabler/StikJITExtensionLauncher.m
      - path: jit-enabler/StikJITExtensionLauncher.h
      # RPCS3's overlay icons as a folder, so the bundle carries Icons/ui/ beside the executable.
      - path: ../bin/Icons
        type: folder
        buildPhase: resources
      # The Android patch asset itself, so the two cannot drift; BundledPatches.swift installs it at launch.
      - path: ../android/armsx3-ui/app/src/main/assets/canary_patches.yml
        buildPhase: resources
      # The XMB wave's starting state, the Android asset itself for the same reason.
      - path: ../android/armsx3-ui/app/src/main/assets/xmb/wave_state.bin
        buildPhase: resources
      # The boot intro, Android's own file; BootSplashView plays it at launch and when the XMB is left.
      - path: ../android/armsx3-ui/app/src/main/res/raw/boot_intro.mp4
        buildPhase: resources

    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: app/ARMSX3.entitlements
        CODE_SIGN_STYLE: Automatic

        # actool merges the icon set's CFBundleIcons into the Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Hand-authored, because a generated Info.plist would discard its explanatory text.
        INFOPLIST_FILE: app/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

        # MoltenVK's include tree, then the repository root and rpcs3/ so the app can include 3rdparty/bcdec/bcdec.hpp.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/3rdparty/MoltenVK/ios-pkg/MoltenVK/include"
          - "$(SRCROOT)/.."
          - "$(SRCROOT)/../rpcs3"
          # Export headers generated by the same configure as the core archive.
          - "$(SRCROOT)/build/${ARMSX3_CMAKE_CONFIG}/exports"

        # XcodeGen gives a .a dependency only a framework search path, so the link needs this -L.
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/build/${ARMSX3_CMAKE_CONFIG}"

        # Swift 5 language mode.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: app/Bridge/Rpcs3-Bridging-Header.h
        # The compiler extracts localizable literals and the String Catalog compiles into en.lproj; XcodeGen sets neither.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CLANG_ENABLE_MODULES: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20

        OTHER_LDFLAGS:
          - "$(inherited)"
          # Force-load the whole core archive so the link proves every member, not only what the app references.
          - "-Wl,-force_load,$(SRCROOT)/build/${ARMSX3_CMAKE_CONFIG}/libarmsx3_ios_core.a"
          # After the force-load pulls everything in, drop whatever nothing references.
          - "-Wl,-dead_strip"

      # Release only: strip the symbol table; the dSYM beside the product keeps the symbols, so archive it for tester builds.
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          # non-global keeps the exported armsx3_jit_enabler_* symbols that dlsym finds at run time; all stripped them.
          STRIP_STYLE: non-global
          SEPARATE_STRIP: NO

    dependencies:
      # One merged archive from ios/scripts/collect-ios-archives.sh, so the build tree's hundreds of archives stay out of this file.
      - framework: build/${ARMSX3_CMAKE_CONFIG}/libarmsx3_ios_core.a
        embed: false

      # Frameworks the core calls into that nothing else here links.
      - sdk: AudioToolbox.framework   # openal-soft's CoreAudio backend
      - sdk: CoreFoundation.framework # CF* symbols
      - sdk: CoreMIDI.framework       # rtmidi
      - sdk: Security.framework       # Sec* symbols

      # iconv is in libc on Linux but a separate libiconv.tbd in the iOS SDK (cellL10n.cpp).
      - sdk: libiconv.tbd

      # libc++ is not listed: the link driver is clang++ while the target has C++ or Objective-C++ sources, and listing it warns about a duplicate.

      - sdk: Metal.framework
      - sdk: QuartzCore.framework

      # MoltenVK's static xcframework, so the bundle stays one signed object; ios/scripts/fetch-moltenvk.sh produces it.
      - framework: 3rdparty/MoltenVK/ios-pkg/MoltenVK/static/MoltenVK.xcframework
        embed: false

      # MoltenVK is static, so the frameworks it calls into are linked here.
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework   # gameplay input and menu navigation
      - sdk: MetricKit.framework        # crash diagnostics
      - sdk: CoreMotion.framework   # the phone's tilt for player 1
      - sdk: CoreMedia.framework    # camera frames
      - sdk: CoreVideo.framework    # camera frames
      - sdk: CoreHaptics.framework   # controller and phone rumble
      - sdk: Photos.framework       # screenshot storage
      - sdk: Accelerate.framework   # vImage permute and scale for recordings

      # librashader is embedded and never linked, because it is MPL-2.0 beside a GPL-2.0-only binary; the core dlopens it.
      - framework: build-deps/librashader-ios/librashader.dylib
        embed: true
        codeSign: true
        link: false

  # The JIT enabler app extension; its entitlements are the literal helper file.
  JITEnabler:
    type: app-extension
    platform: iOS

    # Links the source-built libidevice_ffi.a; no other target names it.
    configFiles:
      Debug: jit-enabler/JITEnablerExtension.xcconfig
      Release: jit-enabler/JITEnablerExtension.xcconfig

    sources:
      - path: jit-enabler/JITEnablerExtension
        excludes:
          - "Info.plist"
      # Only these engine files compile into the helper; ScriptRunner and the rest of engine/ stay uncompiled.
      - path: jit-enabler/engine/BlessCommands.swift
      - path: jit-enabler/engine/EndpointProbe.swift
      - path: jit-enabler/engine/DeveloperDiskImageService.swift
      - path: jit-enabler/engine/StikJITError.swift
      # Mounts the disk image; DDIMount.swift stands in for the one StikJIT.swift type it needs.
      - path: jit-enabler/engine/DDISession.swift
      # Downloads the image when the cached files are unusable.
      - path: jit-enabler/engine/SynchronousDDIDownloader.swift
      # The idevice error check DDISession throws through.
      - path: jit-enabler/engine/IdeviceFFI.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armsx3.ARMSX3.JITEnabler
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: jit-enabler/JITEnabler.entitlements
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        INFOPLIST_FILE: jit-enabler/JITEnablerExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

# XcodeGen emits no scheme without this, and xcodebuild -scheme needs one.
schemes:
  ARMSX3:
    build:
      targets:
        ARMSX3: [run, test, profile, analyze, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
